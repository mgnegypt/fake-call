name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches build version
        run: |
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          PREV_CODE=0
          if [ -n "$PREV_TAG" ]; then
            PREV_CODE="$(git show "${PREV_TAG}:app/build.gradle.kts" | grep -E 'versionCode[[:space:]]*=' | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
          fi
          bash scripts/check-release-version.sh "${GITHUB_REF_NAME}" app/build.gradle.kts "${PREV_CODE:-0}"

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 17 SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set; releases must be signed with the project release key."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare release assets
        id: assets
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/fake-call-v${V}.apk"
          (cd dist && sha256sum "fake-call-v${V}.apk" > "fake-call-v${V}.apk.sha256")
          # Extract this version's section from CHANGELOG.md as the release body.
          awk -v ver="$V" '
            $0 ~ "^## \\[" ver "\\]" {capture=1; print; next}
            capture && $0 ~ "^## \\[" {exit}
            capture {print}
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "Fake Call v${V}" > dist/notes.md
          fi
          cat dist/notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fake Call v${{ steps.ver.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/fake-call-v${{ steps.ver.outputs.version }}.apk
            dist/fake-call-v${{ steps.ver.outputs.version }}.apk.sha256
