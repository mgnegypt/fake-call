name: Test APK

# Manually dispatched TEST build only: builds a release-signed APK with
# the version bumped inside the runner checkout (nothing is committed,
# no tag is created, no GitHub Release is published) and uploads it as a
# workflow artifact for on-device testing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 17 SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Bump version for this test build (runner only, never committed)
        run: |
          sed -i -E 's/versionCode = 3/versionCode = 4/' app/build.gradle.kts
          sed -i -E 's/versionName = "1.2"/versionName = "1.3"/' app/build.gradle.kts
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set; test builds must be signed with the project release key."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare test artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/fake-call-v1.3-test.apk"
          (cd dist && sha256sum "fake-call-v1.3-test.apk" > "fake-call-v1.3-test.apk.sha256")
          ls -l dist

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fake-call-v1.3-test
          path: |
            dist/fake-call-v1.3-test.apk
            dist/fake-call-v1.3-test.apk.sha256
          retention-days: 7
